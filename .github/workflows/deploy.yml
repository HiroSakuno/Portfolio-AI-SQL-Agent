name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy SQL Agent
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/sql-agent
            git pull origin main
            docker build -t sql-agent:latest .
            docker stack deploy -c docker-stack.yml sql-agent
            docker service update --force sql-agent_sql-agent
